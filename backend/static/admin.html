<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KeyAuth Admin Panel</title>
  <style>
    :root {
      --bg: #0b0f17;
      --card: #131a26;
      --border: #243045;
      --text: #e6edf7;
      --muted: #8b9bb4;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green: #10b981;
      --red: #ef4444;
      --amber: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    .container { max-width: 1180px; margin: 0 auto; }
    header {
      display: flex; flex-wrap: wrap; gap: 16px;
      align-items: center; justify-content: space-between;
      margin-bottom: 24px;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    .sub { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 18px;
    }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
    .field { display: flex; flex-direction: column; gap: 6px; min-width: 140px; flex: 1; }
    label { font-size: 0.78rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    input, select {
      background: #0d131d; color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 9px 11px; font-size: 0.92rem;
    }
    button {
      background: var(--accent); color: #fff; border: none; border-radius: 8px;
      padding: 9px 14px; font-weight: 600; font-size: 0.88rem; cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button.sec { background: #1e293b; color: var(--text); border: 1px solid var(--border); }
    button.sec:hover { background: #293548; }
    button.danger { background: rgba(239,68,68,0.16); color: #fca5a5; border: 1px solid rgba(239,68,68,0.35); }
    button.danger:hover { background: rgba(239,68,68,0.28); }
    button.sm { padding: 5px 9px; font-size: 0.78rem; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.88rem; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    th { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; }
    .badge {
      display: inline-block; padding: 3px 8px; border-radius: 999px;
      font-size: 0.74rem; font-weight: 700; text-transform: uppercase;
    }
    .badge.active { background: rgba(16,185,129,0.15); color: #6ee7b7; }
    .badge.unused { background: rgba(59,130,246,0.15); color: #93c5fd; }
    .badge.expired { background: rgba(245,158,11,0.15); color: #fcd34d; }
    .badge.banned { background: rgba(239,68,68,0.15); color: #fca5a5; }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .pubkey-box {
      background: #0d131d; border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 12px; font-size: 0.82rem; display: flex; align-items: center; gap: 10px;
    }
    .toast {
      position: fixed; bottom: 20px; right: 20px;
      background: #1e293b; border: 1px solid var(--accent);
      color: var(--text); padding: 10px 16px; border-radius: 8px;
      display: none; font-size: 0.88rem; z-index: 99;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>KeyAuth Admin Dashboard</h1>
        <div class="sub">Ed25519 Signed License Management & Device Binding</div>
      </div>
      <div class="pubkey-box">
        <span style="color:var(--muted)">Ed25519 Public Key:</span>
        <span id="pubKey" class="mono">loading...</span>
        <button class="sec sm" onclick="copyPubKey()">Copy</button>
      </div>
    </header>

    <div class="card">
      <div class="row">
        <div class="field" style="max-width:340px;">
          <label>Admin Token (X-Admin-Token)</label>
          <input id="adminToken" type="password" placeholder="Paste token printed by server or cli.py token" />
        </div>
        <button onclick="saveTokenAndLoad()">Connect / Refresh</button>
        <div class="field" style="max-width:260px; margin-left:auto;">
          <label>Search Keys / Notes</label>
          <input id="searchBox" type="text" placeholder="Filter..." oninput="loadKeys()" />
        </div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">Generate New License Keys</h3>
      <div class="row">
        <div class="field" style="max-width:110px;">
          <label>Count</label>
          <input id="genCount" type="number" min="1" max="100" value="1" />
        </div>
        <div class="field" style="max-width:130px;">
          <label>Prefix</label>
          <input id="genPrefix" type="text" value="KTAOV" />
        </div>
        <div class="field" style="max-width:150px;">
          <label>Duration (Hours)</label>
          <input id="genHours" type="number" min="1" value="720" />
        </div>
        <div class="field" style="max-width:120px;">
          <label>Max Devices</label>
          <input id="genDevices" type="number" min="1" value="1" />
        </div>
        <div class="field" style="max-width:170px;">
          <label>Countdown Starts</label>
          <select id="genFirstUse">
            <option value="true">On First Login</option>
            <option value="false">Immediately</option>
          </select>
        </div>
        <div class="field">
          <label>Note / Customer</label>
          <input id="genNote" type="text" placeholder="VIP 30 days - user123" />
        </div>
        <button onclick="generateKeys()">Generate</button>
      </div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="margin:0;">License Keys (<span id="keyCount">0</span>)</h3>
        <button class="sec sm" onclick="loadAll()">Reload</button>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>Key</th>
              <th>Status</th>
              <th>Devices</th>
              <th>Duration / Expires</th>
              <th>Note</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="keysBody"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">Recent Verification Logs</h3>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Key</th>
              <th>Device ID</th>
              <th>IP</th>
              <th>Status</th>
              <th>Message</th>
            </tr>
          </thead>
          <tbody id="logsBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const tokenInput = document.getElementById("adminToken");
    tokenInput.value = localStorage.getItem("keyauth_admin_token") || "";

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.style.display = "block";
      setTimeout(() => el.style.display = "none", 2400);
    }

    function escHtml(val) {
      return String(val ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function fmtDate(ts) {
      if (!ts) return "Not activated";
      return new Date(ts * 1000).toLocaleString();
    }

    async function api(path, opts = {}) {
      const headers = Object.assign(
        { "Content-Type": "application/json", "X-Admin-Token": tokenInput.value.trim() },
        opts.headers || {}
      );
      const res = await fetch(path, Object.assign({}, opts, { headers }));
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || data.error || ("HTTP " + res.status));
      return data;
    }

    async function loadPubKey() {
      const data = await fetch("/api/v1/public-key").then(r => r.json());
      document.getElementById("pubKey").textContent = data.public_key_b64;
    }

    function copyPubKey() {
      navigator.clipboard.writeText(document.getElementById("pubKey").textContent);
      toast("Public key copied");
    }

    function saveTokenAndLoad() {
      localStorage.setItem("keyauth_admin_token", tokenInput.value.trim());
      loadAll();
    }

    async function loadKeys() {
      if (!tokenInput.value.trim()) return;
      const q = encodeURIComponent(document.getElementById("searchBox").value || "");
      try {
        const data = await api("/api/admin/keys?search=" + q);
        document.getElementById("keyCount").textContent = data.keys.length;
        const tbody = document.getElementById("keysBody");
        tbody.innerHTML = data.keys.map(k => {
          const safeKey = escHtml(k.license_key);
          const safeStatus = escHtml(k.computed_status);
          const safeDevices = escHtml(k.bound_devices.join(", ") || "-");
          const safeNote = escHtml(k.note || "-");
          const banBtn = k.is_banned
            ? `<button class="sec sm" data-act="unban" data-key="${safeKey}">Unban</button>`
            : `<button class="danger sm" data-act="ban" data-key="${safeKey}">Ban</button>`;
          return `
          <tr>
            <td class="mono"><strong>${safeKey}</strong></td>
            <td><span class="badge ${safeStatus}">${safeStatus}</span></td>
            <td class="mono">${Number(k.bound_devices.length)}/${Number(k.max_devices)}<br><span style="color:var(--muted);font-size:0.75rem">${safeDevices}</span></td>
            <td>${Number(k.duration_hours)}h<br><span style="color:var(--muted);font-size:0.75rem">${escHtml(fmtDate(k.expires_at))}</span></td>
            <td>${safeNote}</td>
            <td>
              <div class="actions">
                <button class="sec sm" data-act="copy" data-key="${safeKey}">Copy</button>
                <button class="sec sm" data-act="reset" data-key="${safeKey}">Reset Dev</button>
                <button class="sec sm" data-act="extend" data-key="${safeKey}">+24h</button>
                ${banBtn}
                <button class="danger sm" data-act="del" data-key="${safeKey}">Del</button>
              </div>
            </td>
          </tr>`;
        }).join("");
      } catch (e) {
        toast("Auth error: " + e.message);
      }
    }

    document.getElementById("keysBody").addEventListener("click", (ev) => {
      const btn = ev.target.closest("button[data-act]");
      if (!btn) return;
      const key = btn.getAttribute("data-key") || "";
      const act = btn.getAttribute("data-act");
      if (act === "copy") copyText(key);
      else if (act === "reset") resetDev(key);
      else if (act === "extend") extendKey(key, 24);
      else if (act === "ban") toggleBan(key, true);
      else if (act === "unban") toggleBan(key, false);
      else if (act === "del") delKey(key);
    });

    async function loadLogs() {
      if (!tokenInput.value.trim()) return;
      try {
        const data = await api("/api/admin/logs?limit=25");
        document.getElementById("logsBody").innerHTML = data.logs.map(l => {
          const ok = l.status === "ok";
          return `
          <tr>
            <td>${escHtml(fmtDate(l.created_at))}</td>
            <td class="mono">${escHtml(l.license_key)}</td>
            <td class="mono">${escHtml(l.device_id)}</td>
            <td class="mono">${escHtml(l.client_ip || "-")}</td>
            <td><span class="badge ${ok ? 'active' : 'banned'}">${escHtml(l.status)}</span></td>
            <td>${escHtml(l.message)}</td>
          </tr>`;
        }).join("");
      } catch {}
    }

    async function loadAll() { await Promise.all([loadKeys(), loadLogs()]); }

    async function generateKeys() {
      try {
        const res = await api("/api/admin/keys", {
          method: "POST",
          body: JSON.stringify({
            count: Number(document.getElementById("genCount").value),
            prefix: document.getElementById("genPrefix").value,
            duration_hours: Number(document.getElementById("genHours").value),
            max_devices: Number(document.getElementById("genDevices").value),
            activate_on_first_use: document.getElementById("genFirstUse").value === "true",
            note: document.getElementById("genNote").value
          })
        });
        toast(`Created ${res.created.length} key(s)`);
        loadAll();
      } catch (e) { toast(e.message); }
    }

    function copyText(txt) {
      navigator.clipboard.writeText(txt);
      toast("Copied " + txt);
    }

    async function resetDev(key) {
      await api(`/api/admin/keys/${encodeURIComponent(key)}/reset-device`, { method: "POST" });
      toast("Device binding reset");
      loadKeys();
    }

    async function extendKey(key, hours) {
      await api(`/api/admin/keys/${encodeURIComponent(key)}/extend`, {
        method: "POST",
        body: JSON.stringify({ extra_hours: hours })
      });
      toast(`Extended by +${hours}h`);
      loadKeys();
    }

    async function toggleBan(key, ban) {
      const action = ban ? "ban" : "unban";
      await api(`/api/admin/keys/${encodeURIComponent(key)}/${action}`, {
        method: "POST",
        body: JSON.stringify({ reason: "Banned via Admin Panel" })
      });
      toast(ban ? "Key banned" : "Key unbanned");
      loadKeys();
    }

    async function delKey(key) {
      if (!confirm("Delete key " + key + "?")) return;
      await api(`/api/admin/keys/${encodeURIComponent(key)}`, { method: "DELETE" });
      toast("Deleted " + key);
      loadKeys();
    }

    loadPubKey();
    if (tokenInput.value) loadAll();
  </script>
</body>
</html>
